function draw(c,src,mirror){
  c.width=W;c.height=H;const g=c.getContext('2d');
  if(src){const sw=src.videoWidth||src.width,sh=src.videoHeight||src.height,r=Math.max(WIN.w/sw,WIN.h/sh),dw=sw*r,dh=sh*r;
    g.fillStyle='#FFF7E8';g.fillRect(0,0,W,H);g.save();g.beginPath();g.rect(WIN.x,WIN.y,WIN.w,WIN.h);g.clip();
    if(mirror){g.translate(WIN.x*2+WIN.w,0);g.scale(-1,1)}
    g.drawImage(src,WIN.x+(WIN.w-dw)/2,WIN.y+(WIN.h-dh)/2,dw,dh);g.restore();}
  g.drawImage(FR,0,0,W,H);
}
const sampleCanvas=h=>{const c=document.createElement('canvas');c.width=600;c.height=750;const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,750);gr.addColorStop(0,`hsl(${h},70%,60%)`);gr.addColorStop(1,`hsl(${h+40},60%,25%)`);g.fillStyle=gr;g.fillRect(0,0,600,750);
  g.fillStyle='#f3c9a0';g.beginPath();g.arc(300,330,120,0,7);g.fill();g.fillStyle='#2a1a12';g.beginPath();g.arc(300,300,125,Math.PI,0);g.fill();
  g.fillStyle='#e8357a';g.beginPath();g.ellipse(300,700,230,190,0,0,7);g.fill();g.fillStyle='#222';[255,345].forEach(x=>{g.beginPath();g.arc(x,330,9,0,7);g.fill()});
  g.strokeStyle='#a33';g.lineWidth=6;g.beginPath();g.arc(300,365,40,.2,Math.PI-.2);g.stroke();
  g.font='60px serif';g.fillText('🪔',60,120);g.fillText('✨',470,110);return c};
const toURL=(src,m)=>{const c=document.createElement('canvas');draw(c,src,m);return c.toDataURL('image/png')};
const blobOf=async u=>(await fetch(u)).blob();
const dl=u=>{const a=document.createElement('a');a.href=u;a.download='xerago-diwali.png';a.click()};

const QR=()=>{const cells=[];for(let i=0;i<21;i++)for(let j=0;j<21;j++){const f=(i<7&&j<7)||(i<7&&j>13)||(i>13&&j<7);if(!f&&((i*7+j*13+i*j)%3===0))cells.push(<rect key={i+'-'+j} x={j} y={i} width="1" height="1"/>)}
  const fd=(x,y)=><g key={x+'_'+y}><rect x={x} y={y} width="7" height="7"/><rect x={x+1} y={y+1} width="5" height="5" fill="#FFF7E8"/><rect x={x+2} y={y+2} width="3" height="3"/></g>;
  return <svg viewBox="-1 -1 23 23" className="w-44 h-44" fill="#005239"><rect x="-1" y="-1" width="23" height="23" fill="#fff"/>{cells}{fd(0,0)}{fd(14,0)}{fd(0,14)}</svg>};

const api=async(u,o={})=>{const r=await fetch(u,{credentials:'same-origin',...o,headers:{'Content-Type':'application/json','X-XDM':'1'},body:o.body?JSON.stringify(o.body):undefined});let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw Object.assign(new Error(j.error||'Something went wrong'),{status:r.status,code:j.code});return j};
const Sheet=({children,w='max-w-sm'})=><div className="fixed inset-0 z-40 bg-black/50 flex items-end sm:items-center justify-center p-4"><div className={`fade bg-[#FFF7E8] rounded-3xl p-6 w-full ${w} border-2 border-[#DAA23A] max-h-[90vh] overflow-auto`} style={{fontFamily:'system-ui'}}>{children}</div></div>;
const inp="border-2 border-[#005239]/30 rounded-xl p-3 bg-white w-full";
const fmt=t=>new Date(t).toLocaleString([],{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
function App(){
  const [cfg,setCfg]=useState(null),[me,setMe]=useState(undefined),[scr,setScr]=useState('welcome'),[help,setHelp]=useState(false),[consent,setConsent]=useState(false),[rep,setRep]=useState(null),[img,setImg]=useState(null),[toast,setToast]=useState('');
  const [gal,setGal]=useState({own:[],others:[]}),[tab,setTab]=useState('new'),[last,setLast]=useState(0),[f,setF]=useState({name:'',empId:'',dept:''}),[remember,setRemember]=useState(true);
  const say=m=>{setToast(m);setTimeout(()=>setToast(''),2600)};
  const run=async fn=>{try{return await fn()}catch(e){say(e.message);if(e.status===401){setMe(null);setScr('login')}if(e.code==='expired')api('/api/config').then(setCfg)}};
  const loadGal=()=>run(async()=>setGal(await api('/api/gallery')));
  useEffect(()=>{(async()=>{const c=await api('/api/config');setCfg(c);try{const m=await api('/api/me');setMe(m);setScr('home');if(!localStorage.getItem('xdm_seen'))setHelp(true)}catch(e){setMe(null);setScr(location.hash==='#scan'?'login':'welcome')}})().catch(()=>say('Cannot reach the server'))},[]);
  useEffect(()=>{if(scr==='gallery')loadGal()},[scr]);
  if(!cfg||me===undefined)return <div className="min-h-screen flex items-center justify-center text-[#005239]" style={{background:'#FFF7E8'}}><Logo/></div>;
  const E=cfg.expired&&!me&&(scr==='welcome'||scr==='login')?'expired':scr;
  const active=gal.own.filter(p=>p.status!=='rejected').length;
  const others=[...gal.others].sort(tab==='new'?(a,b)=>b.at-a.at:(a,b)=>b.votes-a.votes||b.at-a.at);
  const gl=[...gal.own,...others];
  const goCam=()=>cfg.expired?say('This QR code has expired'):setScr('camera');
  const login=()=>run(async()=>{const m=await api('/api/auth/employee',{method:'POST',body:{...f,remember}});setMe(m);localStorage.setItem('xdm_seen',1);setScr('home');setHelp(true)});
  const logout=()=>run(async()=>{await api('/api/auth/logout',{method:'POST'});setMe(null);setF({name:'',empId:'',dept:''});setScr('login')});
  const submit=()=>run(async()=>{const r=await api('/api/photos',{method:'POST',body:{image:img}});say(r.status==='approved'?'Posted to the gallery!':'Submitted. It will appear after approval.');setTab('new');setScr('gallery')});
  const vote=x=>run(async()=>{await api(`/api/photos/${x.id}/vote`,{method:'POST'});setLast(x.id);await loadGal()});
  const report=c=>run(async()=>{await api(`/api/photos/${rep.id}/report`,{method:'POST',body:{category:c}});setRep(null);say('Report received. Photo hidden pending review.');await loadGal()});
  const del=x=>run(async()=>{await api('/api/photos/'+x.id,{method:'DELETE'});say('Photo deleted. Slot freed.');await loadGal()});
  const share=async()=>{try{const b=await blobOf(img),fl=new File([b],'diwali.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[fl]}))await navigator.share({files:[fl],title:'Xerago Diwali'});else{dl(img);say('Sharing unsupported – downloaded instead')}}catch(e){if(e.name!=='AbortError'){dl(img);say('Downloaded instead')}}};
  const post=()=>active>=cfg.maxPosts?say(`You have used all ${cfg.maxPosts} gallery posts. You can still capture and download.`):setConsent(true);
  const steps=[['camera','Frame your moment'],['switch','Tap switch for front/back camera'],['retake','Retake as often as you like'],['download','Download privately or post up to three photos'],['heart','Browse and vote for favourites']];
  return <div className="mx-auto max-w-md min-h-screen relative overflow-hidden" style={{background:'#FFF7E8'}}>
    {toast&&<div className="fade fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-[#005239] text-white text-sm px-4 py-2 rounded-full shadow-lg text-center" style={{fontFamily:'system-ui',maxWidth:'90%'}}>{toast}</div>}
    {E==='expired'&&<div className="fade p-8 text-center pt-20 flex flex-col items-center gap-4"><Logo s={28}/><div className="text-5xl">🪔</div><h2 className="text-2xl text-[#005239] font-bold">This QR code has expired</h2><p className="text-sm text-stone-600">Thank you for celebrating Diwali with Xerago. The photo experience is now closed.</p></div>}
    {E==='welcome'&&<div className="fade p-6 flex flex-col items-center text-center gap-4 pt-10"><Logo s={30}/><div className="p-4 bg-white rounded-3xl shadow-xl border-4 border-[#DAA23A]/40"><QR/></div>
      <h1 className="text-3xl text-[#005239] font-bold">Scan. Capture. Celebrate.</h1><p className="text-sm text-stone-600">Scan the QR code on your Xerago sweet box to begin.</p>
      <button className="btn pri w-full" onClick={()=>setScr('login')}><Ic n="scan"/>Continue</button></div>}
    {E==='login'&&<div className="fade p-6 flex flex-col gap-3 pt-10" style={{fontFamily:'system-ui'}}><div className="text-center"><Logo s={26}/></div>

      <button className="btn pri w-full" onClick={goCam}><Ic n="camera"/>Open Camera</button><button className="btn sec w-full" onClick={()=>setHelp(true)}><Ic n="help" s={18}/>How it works</button>
      <button className="btn sec w-full" onClick={()=>setScr('gallery')}><Ic n="heart" s={18}/>Browse gallery</button>
      <button className="text-xs underline text-stone-500" style={{fontFamily:'system-ui'}} onClick={logout}>Not {me.name.split(' ')[0]}? Switch account</button></div>}
    {help&&<Sheet><h3 className="text-xl text-[#005239] font-bold text-center" style={{fontFamily:'Georgia'}}>Ready to capture your Diwali moment?</h3><p className="text-center text-sm text-stone-500 mb-4">Here's how it works.</p>
      {steps.map(([i,t],k)=><div key={t} className="flex gap-3 items-center mb-3"><div className="w-9 h-9 rounded-full bg-[#005239] text-white flex items-center justify-center shrink-0"><Ic n={i} s={16}/></div><div className="text-sm font-semibold">{k+1}. {t}</div></div>)}
      <p className="text-xs text-center text-[#8a5a00] bg-[#DAA23A]/20 rounded-lg p-2 mb-4">Only upload photos with permission from everyone clearly shown.</p>
      <button className="btn pri w-full" onClick={()=>{setHelp(false);goCam()}}>Get Started</button><button className="w-full text-xs text-stone-500 mt-3" onClick={()=>setHelp(false)}>Close</button></Sheet>}
    {consent&&<Sheet><h3 className="text-xl text-[#005239] font-bold text-center mb-2" style={{fontFamily:'Georgia'}}>Post to Gallery?</h3>
      <p className="text-sm text-center text-stone-600 mb-5">Only post if everyone in the photo agrees. {cfg.autoPublish?'It will be visible to colleagues right away.':'It will appear after admin approval.'}</p>
      <button className="btn pri w-full" onClick={()=>{setConsent(false);submit()}}>Yes, post</button><button className="w-full text-sm text-stone-500 mt-3" onClick={()=>setConsent(false)}>Cancel</button></Sheet>}
    {rep&&<Sheet><h3 className="text-lg text-[#005239] font-bold mb-3" style={{fontFamily:'Georgia'}}>Report this photo</h3>
      {['No consent','Harassment / Inappropriate','Privacy / confidentiality','Impersonation','Other'].map(c=><button key={c} className="btn sec w-full mb-2" onClick={()=>report(c)}>{c}</button>)}<button className="w-full text-xs text-stone-500 mt-2" onClick={()=>setRep(null)}>Cancel</button></Sheet>}
    {E==='camera'&&<Cam onClose={()=>setScr('home')} onShot={u=>{setImg(u);setScr('preview')}} say={say}/>}
    {E==='preview'&&<div className="fade p-5 flex flex-col gap-3"><img src={img} className="w-full rounded-xl shadow-xl" alt="preview"/>
      <p className="text-[11px] text-center text-stone-500" style={{fontFamily:'system-ui'}}>Private until you post. Retakes and downloads never use your {cfg.maxPosts} slots.</p>
      <div className="grid grid-cols-2 gap-3"><button className="btn sec" onClick={()=>setScr('camera')}><Ic n="retake" s={18}/>Retake</button><button className="btn sec" onClick={()=>{dl(img);say('Downloaded!')}}><Ic n="download" s={18}/>Download</button>
      <button className="btn sec" onClick={share}><Ic n="share" s={18}/>Share</button><button className="btn pri" onClick={post}><Ic n="img" s={18}/>Post ({active}/{cfg.maxPosts})</button></div></div>}
    {E==='gallery'&&<div className="fade p-4 pb-28"><button className="text-xs text-[#005239] mb-1" style={{fontFamily:'system-ui'}} onClick={()=>setScr('home')}>← Home</button><div className="flex justify-center mb-2"><Logo s={22}/></div><h2 className="text-center text-2xl text-[#005239] font-bold">Diwali Gallery</h2>
      <p className="text-center text-[11px] text-stone-500 mb-3" style={{fontFamily:'system-ui'}}>{active} of {cfg.maxPosts} gallery posts used</p>
      <div className="flex bg-[#005239]/10 rounded-full p-1 mb-4" style={{fontFamily:'system-ui'}}>{[['new','New Posts'],['top','Top Favourites']].map(([k,l])=><button key={k} onClick={()=>setTab(k)} className={`flex-1 py-2 rounded-full text-sm font-semibold ${tab===k?'bg-[#005239] text-white':'text-[#005239]'}`}>{l}</button>)}</div>
      {!cfg.voting&&<p className="text-xs text-center text-red-700 mb-2" style={{fontFamily:'system-ui'}}>Voting is currently paused.</p>}
      {!gl.length&&<p className="text-center text-sm text-stone-500 py-10">No photos yet. Be the first to post!</p>}
      <div className="grid grid-cols-2 gap-3">{gl.map(x=>{const lab=x.own&&{pending:['Your upload · Pending review','#b7791f'],approved:['Your upload','#005239'],rejected:['Your upload · Not approved','#b91c1c']}[x.status];
        return <div key={x.id} className="bg-white rounded-xl p-2 shadow relative">{x.own&&<span className="absolute top-3 left-3 z-10 text-white text-[10px] px-2 py-0.5 rounded-full" style={{background:lab[1],fontFamily:'system-ui'}}>{lab[0]}</span>}
        <img src={x.url} className="w-full rounded" alt=""/><div className="flex items-center justify-between mt-2 px-1" style={{fontFamily:'system-ui'}}>
        {(!x.own||x.status==='approved')?<button onClick={()=>!x.own&&vote(x)} className="flex items-center gap-1 text-sm font-semibold" style={{color:x.voted?'#d6245f':'#005239',opacity:x.own?.5:1}}><span key={x.voted?last:0} className={x.voted&&last===x.id?'pop':''}><Ic n="heart" s={20} fill={x.voted}/></span>{x.votes}</button>:<span className="text-[11px] text-stone-500">{x.status==='pending'?'Awaiting approval':'Not published'}</span>}
        {x.own?<button onClick={()=>del(x)} className="text-stone-400" aria-label="Delete"><Ic n="trash" s={16}/></button>:<button onClick={()=>setRep(x)} className="text-stone-400" aria-label="Report"><Ic n="flag" s={16}/></button>}</div></div>})}</div>
      <p className="text-[10px] text-stone-500 text-center mt-4" style={{fontFamily:'system-ui'}}>Please be respectful of everyone pictured. Screenshots cannot be fully prevented.</p>
      <div className="fixed bottom-4 left-0 right-0 max-w-md mx-auto px-4"><button className="btn pri w-full" onClick={goCam}><Ic n="camera"/>Take Another Photo</button></div></div>}
  </div>}
function Cam({onClose,onShot,say}){
  const vid=useRef(),ov=useRef(),[face,setFace]=useState('user'),[fb,setFb]=useState(false),[err,setErr]=useState(''),st=useRef(),fbSrc=useMemo(()=>sampleCanvas(30),[]);
  useEffect(()=>{draw(ov.current)},[]);
  useEffect(()=>{let dead=false;setErr('');
    (async()=>{try{if(!navigator.mediaDevices?.getUserMedia)throw new Error('Camera not supported here');
      st.current?.getTracks().forEach(t=>t.stop());
      const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:face},audio:false});
      if(dead){s.getTracks().forEach(t=>t.stop());return}st.current=s;setFb(false);vid.current.srcObject=s;vid.current.play()}
    catch(e){setFb(true);setErr(e.name==='NotAllowedError'?'Camera permission denied':e.message||'Camera unavailable')}})();
    return()=>{dead=true;st.current?.getTracks().forEach(t=>t.stop())}},[face]);
  const shoot=()=>onShot(fb?toURL(fbSrc,false):toURL(vid.current,face==='user'));
  const stop=()=>{st.current?.getTracks().forEach(t=>t.stop());onClose()};
  const pos={left:'24.6%',top:'18.15%',width:'51%',height:'58.2%'};
  return <div className="fade bg-black min-h-screen flex flex-col items-center justify-between py-4">
    <div className="w-full flex justify-between px-4 text-white" style={{fontFamily:'system-ui'}}><button onClick={stop} aria-label="Close"><Ic n="x" s={26}/></button><span className="text-sm opacity-80">{fb?'Sample mode':'Live camera'}</span><span className="w-6"/></div>
    <div className="relative w-full max-w-md" style={{aspectRatio:'882/1058'}}>
      <div className="absolute overflow-hidden bg-black" style={pos}>
        {fb?<canvas ref={c=>{if(c){c.width=600;c.height=750;c.getContext('2d').drawImage(fbSrc,0,0)}}} className="w-full h-full object-cover"/>
        :<video ref={vid} playsInline muted className="w-full h-full object-cover" style={{transform:face==='user'?'scaleX(-1)':'none'}}/>}</div>
      <canvas ref={ov} className="absolute inset-0 w-full h-full"/></div>
    {err&&<div className="text-xs text-amber-300 px-4 text-center" style={{fontFamily:'system-ui'}}>{err} — using sample image so you can still test.</div>}
    <div className="flex items-center gap-8 text-white">
      <button onClick={()=>fb?say('Switching needs a real camera'):setFace(f=>f==='user'?'environment':'user')} className="p-3 rounded-full bg-white/15" aria-label="Switch"><Ic n="switch" s={24}/></button>
      <button onClick={shoot} className="w-20 h-20 rounded-full bg-white border-4 border-[#DAA23A] active:scale-90 transition" aria-label="Capture"/>
      <button onClick={stop} className="p-3 rounded-full bg-white/15" aria-label="Close"><Ic n="x" s={24}/></button></div></div>}
const go=()=>ReactDOM.createRoot(document.getElementById('root')).render(<App/>);FR.complete&&FR.naturalWidth?go():(FR.onload=go);
</script></body></html>
